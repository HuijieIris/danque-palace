<p>宫苑取意于盛唐宫阙。沿朱雀门进入庭院，穿过两侧回廊之间的中轴，抬头可见含元殿的金瓦重檐。殿前，双龙浮雕沿石阶中央的踏道盘绕。</p>

gradient.addColorStop(0,'rgba(255,255,255,.85)');gradient.addColorStop(.42,'rgba(255,255,255,.36)');gradient.addColorStop(1,'rgba(255,255,255,0)');
fc.fillStyle=gradient;fc.fillRect(0,0,128,128);
const mistMap=new T.CanvasTexture(fogCanvas), mists=[];
for(let i=0;i<21;i++){
 const o=new T.Sprite(new T.SpriteMaterial({map:mistMap,color:0xf5cfb5,opacity:.12,depthWrite:false}));
 o.scale.set(12+random()*8,.45+random()*.9,1);o.position.set(random()*52-26,.25+random()*1.4,random()*48-23);scene.add(o);mists.push({o,x:o.position.x,phase:random()*6});
}
const hills=mat(0x55535c,.98);
for(let i=0;i<35;i++){
 const a=i/35*Math.PI*2,r=62+random()*22;
 const o=mesh(scene,new T.DodecahedronGeometry(1,1),hills,Math.cos(a)*r,-4,Math.sin(a)*r,9+random()*14,7+random()*13,6+random()*12);o.rotation.y=a;
}
const notice=document.querySelector('#notice');
const nightButton=document.querySelector('#mode');
let after=0,night=0,wantsNight=false, flight;
function show(message){notice.textContent=message;clearTimeout(after);after=setTimeout(()=>notice.textContent='',2100);}
nightButton.onclick=()=>{wantsNight=!wantsNight;nightButton.textContent=wantsNight?'破晓':'入夜';nightButton.setAttribute('aria-pressed',wantsNight);};
const clock=new T.Clock(), ray=new T.Raycaster(), pointer=new T.Vector2();
function fly(p,t){flight={from:camera.position.clone(),target:controls.target.clone(),p,t,start:clock.elapsedTime};}
document.querySelector('#court').onclick=()=>fly(V(8,4.8,8.5),V(0,4.4,-14));
document.querySelector('#reset').onclick=()=>fly(V(37,25,55),V(0,5,-5));
const canvas=renderer.domElement;
let down;
canvas.addEventListener('pointerdown',e=>{flight=null;down=[e.clientX,e.clientY,e.button];});
canvas.addEventListener('pointerup',e=>{
 if(!down||down[2]!==0||Math.hypot(e.clientX-down[0],e.clientY-down[1])>6)return;
 pointer.set(e.clientX/innerWidth*2-1,1-e.clientY/innerHeight*2);ray.setFromCamera(pointer,camera);
 const hits=ray.intersectObjects(scene.children,true);
 for(const hit of hits){
  if(hit.object.isSprite)continue;
  for(let o=hit.object;o;o=o.parent){
   if(actions.has(o)){show(actions.get(o)());return;}
  }
  break;
 }
});
const keys=new Set();
addEventListener('keydown',e=>{if(!e.altKey&&!e.ctrlKey&&!e.metaKey&&['KeyW','KeyA','KeyS','KeyD'].includes(e.code)){keys.add(e.code);flight=null;}});
addEventListener('keyup',e=>keys.delete(e.code));addEventListener('blur',()=>keys.clear());
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
const dayFog=new T.Color(0xd09b7b),nightFog=new T.Color(0x18253d),daySun=new T.Color(0xffc27e),nightSun=new T.Color(0x9ebdff);
notice.textContent='';
renderer.setAnimationLoop(()=>{
 const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
 if(flight){
  const n=Math.min((t-flight.start)/1.3,1),s=n*n*(3-2*n);
  view(flight.from.clone().lerp(flight.p,s),flight.target.clone().lerp(flight.t,s));if(n===1)flight=null;
 }
 if(keys.size){
  const f=camera.getWorldDirection(V(0,0,0));f.y=0;f.normalize();const right=V(-f.z,0,f.x);
  const move=f.multiplyScalar(Number(keys.has('KeyW'))-Number(keys.has('KeyS'))).addScaledVector(right,Number(keys.has('KeyD'))-Number(keys.has('KeyA')));
  move.normalize().multiplyScalar(dt*7);camera.position.add(move);controls.target.add(move);
 }
 controls.update();sky.position.copy(camera.position);
 night=T.MathUtils.damp(night,wantsNight?1:0,2.2,dt);
 sky.material.uniforms.night.value=night;
 scene.fog.color.copy(dayFog).lerp(nightFog,night);
 sun.color.copy(daySun).lerp(nightSun,night);sun.intensity=T.MathUtils.lerp(3.2,.66,night);
 hemi.intensity=T.MathUtils.lerp(2,.78,night);
 hemi.color.set(0xffead8).lerp(nightSun,night);
 for(const l of lamps){
  const power=l.on===null?night:Number(l.on);
  l.glow.emissiveIntensity=T.MathUtils.damp(l.glow.emissiveIntensity,.08+3.9*power,6,dt);
  if(l.bulb)l.bulb.intensity=19*l.glow.emissiveIntensity;
 }
 for(const {g,sign} of doors)g.rotation.y=T.MathUtils.damp(g.rotation.y,open?-sign*1.46:0,5,dt);
 for(const {pivot,start} of bells){const elapsed=t-start;pivot.rotation.x=.38*Math.exp(-elapsed*.7)*Math.sin(elapsed*8);}
 for(const {flag,base,phase} of flags){
  const a=flag.geometry.attributes.position;
  for(let i=0;i<a.count;i++){
   const x=base[i*3],y=base[i*3+1], hang=(1.18-y)/2.36;
   a.setZ(i,hang*(Math.sin(x*6-y*3.4+t*4+phase)*.24+Math.sin(t*2+y*4)*.09));
  }
  a.needsUpdate=true;flag.geometry.computeVertexNormals();
 }
 for(const {o,x,phase} of mists){o.position.x=x+Math.sin(t*.16+phase)*5;o.material.opacity=.16+night*.04;}
 renderer.render(scene,camera);
});
</script>
<script>document.querySelector('#about-open').onclick=()=>document.querySelector('#about').showModal();addEventListener('error',e=>{const n=document.querySelector('#notice');if(n.textContent==='正在加载宫苑…')n.textContent='宫苑加载失败，请检查 CDN 网络连接与 WebGL 支持。';},true);</script>
</body>
</html>
